name: Maven Automated Testing


on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        run: mvn --batch-mode -DskipTests package

      # Part 2: runs the MainTest class (all 55 unit tests)
      - name: Test
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true -Dtest=MainTest test
